<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#181f2a"/>
    </linearGradient>
    <linearGradient id="moonBody" x1="0.3" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffef6"/>
      <stop offset="60%" stop-color="#f5ecc0"/>
      <stop offset="100%" stop-color="#e8d48b"/>
    </linearGradient>
    <linearGradient id="moonEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fffdf0"/>
      <stop offset="100%" stop-color="#f0dfa0"/>
    </linearGradient>
    <linearGradient id="catBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#26262b"/>
      <stop offset="100%" stop-color="#34343b"/>
    </linearGradient>
    <!-- Trail gradients: bright at head (right of bbox), transparent at tail (left of bbox) -->
    <linearGradient id="trail1" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffe8a0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffe8a0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="900" height="220" rx="18" ry="18"/>
    </clipPath>
    <!-- Wide soft glow for moon atmosphere -->
    <filter id="moonGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <!-- Tighter glow for crescent halo -->
    <filter id="moonHalo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Shooting star head glow -->
    <filter id="starGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="900" height="220" fill="url(#sky)"/>

    <!-- ============================================================ -->
    <!-- TWINKLING STARS                                               -->
    <!-- ============================================================ -->
    <g fill="#ffffff">
      <circle cx="55" cy="24" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="105" cy="45" r="1.1"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="205" cy="20" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="95" r="1.1"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="130" r="1.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="440" cy="55" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="145" r="1.1"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="80" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="855" cy="150" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="150" r="1.1"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.0s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="30" r="1.1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.3s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="30" r="1.1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.9s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="22" r="1.0"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="160" r="1.0"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.1s" begin="2.0s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="85" r="1.1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ============================================================ -->
    <!-- SHOOTING STAR #1 — slow, disintegrating                      -->
    <!-- Falls upper-left → lower-right (gravity).                    -->
    <!-- Head shrinks, trail shortens, glow fades = disintegration.   -->
    <!-- Duration: 14s (visible ~5.2s, pause ~8.8s)                   -->
    <!-- ============================================================ -->
    <g>
      <!-- Trail line: shortens and thins as star burns up -->
      <line x1="0" y1="0" x2="-38" y2="-17" stroke="url(#trail1)" stroke-width="0" stroke-linecap="round">
        <animate attributeName="stroke-width" values="0;2.2;2.2;1.4;0.5;0;0" keyTimes="0;0.03;0.22;0.30;0.37;0.40;1" dur="14s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="0;-38;-38;-24;-10;0;0" keyTimes="0;0.03;0.22;0.30;0.37;0.40;1" dur="14s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="0;-17;-17;-11;-4;0;0" keyTimes="0;0.03;0.22;0.30;0.37;0.40;1" dur="14s" begin="1.5s" repeatCount="indefinite"/>
      </line>
      <!-- Glow around head: shrinks and dims -->
      <circle cx="0" cy="0" r="0" fill="#fff3c4" filter="url(#starGlow)">
        <animate attributeName="r" values="0;5;5;3;1;0;0" keyTimes="0;0.03;0.22;0.30;0.37;0.40;1" dur="14s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0.4;0.25;0.08;0;0" keyTimes="0;0.03;0.22;0.30;0.37;0.40;1" dur="14s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Bright head: shrinks to nothing -->
      <circle cx="0" cy="0" r="0" fill="#ffffff">
        <animate attributeName="r" values="0;1.8;1.8;1.1;0.4;0;0" keyTimes="0;0.03;0.22;0.30;0.37;0.40;1" dur="14s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Position: diagonal fall with gravity easing -->
      <animateTransform attributeName="transform" type="translate"
        values="280,12; 280,12; 460,108; 460,108"
        keyTimes="0; 0.03; 0.40; 1"
        keySplines="0 0 1 1; 0.15 0 0.65 0.45; 0 0 1 1"
        calcMode="spline"
        dur="14s" begin="1.5s" repeatCount="indefinite"/>
      <!-- Master opacity envelope -->
      <animate attributeName="opacity"
        values="0;0.95;1;0.6;0.15;0;0"
        keyTimes="0;0.03;0.22;0.30;0.37;0.40;1"
        dur="14s" begin="1.5s" repeatCount="indefinite"/>
    </g>

    <!-- ============================================================ -->
    <!-- SHOOTING STAR #2 — slow, disintegrating                      -->
    <!-- Duration: 16s (visible ~6s, pause ~10s)                      -->
    <!-- ============================================================ -->
    <g>
      <line x1="0" y1="0" x2="-32" y2="-14" stroke="url(#trail2)" stroke-width="0" stroke-linecap="round">
        <animate attributeName="stroke-width" values="0;1.8;1.8;1.1;0.4;0;0" keyTimes="0;0.03;0.24;0.32;0.38;0.42;1" dur="16s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="0;-32;-32;-18;-6;0;0" keyTimes="0;0.03;0.24;0.32;0.38;0.42;1" dur="16s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="0;-14;-14;-8;-2;0;0" keyTimes="0;0.03;0.24;0.32;0.38;0.42;1" dur="16s" begin="6s" repeatCount="indefinite"/>
      </line>
      <circle cx="0" cy="0" r="0" fill="#fff3c4" filter="url(#starGlow)">
        <animate attributeName="r" values="0;4;4;2.5;0.8;0;0" keyTimes="0;0.03;0.24;0.32;0.38;0.42;1" dur="16s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.35;0.35;0.2;0.06;0;0" keyTimes="0;0.03;0.24;0.32;0.38;0.42;1" dur="16s" begin="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="0" fill="#ffffff">
        <animate attributeName="r" values="0;1.5;1.5;0.9;0.3;0;0" keyTimes="0;0.03;0.24;0.32;0.38;0.42;1" dur="16s" begin="6s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="translate"
        values="470,8; 470,8; 630,92; 630,92"
        keyTimes="0; 0.03; 0.42; 1"
        keySplines="0 0 1 1; 0.15 0 0.65 0.45; 0 0 1 1"
        calcMode="spline"
        dur="16s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0;0.9;1;0.55;0.12;0;0"
        keyTimes="0;0.03;0.24;0.32;0.38;0.42;1"
        dur="16s" begin="6s" repeatCount="indefinite"/>
    </g>

    <!-- ============================================================ -->
    <!-- SHOOTING STAR #3 — smaller, fainter, different timing        -->
    <!-- Duration: 20s (visible ~6s, long pause ~14s)                 -->
    <!-- ============================================================ -->
    <g>
      <line x1="0" y1="0" x2="-24" y2="-10" stroke="url(#trail1)" stroke-width="0" stroke-linecap="round">
        <animate attributeName="stroke-width" values="0;1.4;1.4;0.9;0.3;0;0" keyTimes="0;0.02;0.18;0.24;0.29;0.32;1" dur="20s" begin="12s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="0;-24;-24;-14;-5;0;0" keyTimes="0;0.02;0.18;0.24;0.29;0.32;1" dur="20s" begin="12s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="0;-10;-10;-6;-2;0;0" keyTimes="0;0.02;0.18;0.24;0.29;0.32;1" dur="20s" begin="12s" repeatCount="indefinite"/>
      </line>
      <circle cx="0" cy="0" r="0" fill="#fff3c4" filter="url(#starGlow)">
        <animate attributeName="r" values="0;3;3;1.8;0.5;0;0" keyTimes="0;0.02;0.18;0.24;0.29;0.32;1" dur="20s" begin="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.3;0.3;0.15;0.04;0;0" keyTimes="0;0.02;0.18;0.24;0.29;0.32;1" dur="20s" begin="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="0" fill="#ffffff">
        <animate attributeName="r" values="0;1.1;1.1;0.6;0.2;0;0" keyTimes="0;0.02;0.18;0.24;0.29;0.32;1" dur="20s" begin="12s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="translate"
        values="130,6; 130,6; 270,72; 270,72"
        keyTimes="0; 0.02; 0.32; 1"
        keySplines="0 0 1 1; 0.1 0 0.7 0.5; 0 0 1 1"
        calcMode="spline"
        dur="20s" begin="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0;0.85;1;0.5;0.1;0;0"
        keyTimes="0;0.02;0.18;0.24;0.29;0.32;1"
        dur="20s" begin="12s" repeatCount="indefinite"/>
    </g>

    <!-- ============================================================ -->
    <!-- CRESCENT MOON                                                 -->
    <!-- Proper banana-shaped crescent using a single closed path     -->
    <!-- made of two arcs — NO dark-circle overlay.                   -->
    <!--                                                               -->
    <!-- Outer arc (r=42): right semicircle = lit edge of moon.       -->
    <!-- Inner arc (r=60): flatter return curve = shadow terminator.  -->
    <!-- The area between them IS the crescent. Sky shows through     -->
    <!-- naturally because there's nothing opaque behind it.          -->
    <!-- ============================================================ -->

    <!-- Soft wide atmospheric glow (offset toward the lit side) -->
    <path d="M 800,18 A 42,42 0 0,1 800,102 A 60,60 0 0,0 800,18 Z"
          fill="#fff8d0" opacity="0.12" filter="url(#moonGlow)"/>

    <!-- Medium crescent halo — pulsing gently -->
    <path d="M 800,18 A 42,42 0 0,1 800,102 A 60,60 0 0,0 800,18 Z"
          fill="#fff3c9" filter="url(#moonHalo)">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- Crisp crescent surface -->
    <path d="M 800,18 A 42,42 0 0,1 800,102 A 60,60 0 0,0 800,18 Z"
          fill="url(#moonBody)"/>

    <!-- Subtle bright edge highlight on outer rim -->
    <path d="M 800,18 A 42,42 0 0,1 800,102"
          fill="none" stroke="#fffef2" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- ============================================================ -->
    <!-- CAT — sitting, tail swaying, blinking                        -->
    <!-- ============================================================ -->
    <g transform="translate(165,206)">

      <!-- tail — gentle sinusoidal sway -->
      <path d="M 48 -10 Q 92 -34 86 -84 Q 82 -107 60 -103"
            fill="none" stroke="url(#catBody)" stroke-width="13" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="0 48 -10; 10 48 -10; 0 48 -10; -6 48 -10; 0 48 -10"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="5s" repeatCount="indefinite"/>
      </path>

      <!-- body -->
      <ellipse cx="0" cy="-38" rx="54" ry="39" fill="url(#catBody)"/>
      <!-- moonlit rim highlight on body -->
      <path d="M 34 -70 A 54 39 0 0 1 18 -2" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3" stroke-linecap="round"/>

      <!-- front paws -->
      <ellipse cx="-25" cy="-4" rx="10" ry="7" fill="url(#catBody)"/>
      <ellipse cx="25" cy="-4" rx="10" ry="7" fill="url(#catBody)"/>

      <!-- head -->
      <circle cx="0" cy="-96" r="33" fill="url(#catBody)"/>
      <!-- moonlit rim highlight on head -->
      <path d="M 27 -117 A 33 33 0 0 1 8 -64" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2.2" stroke-linecap="round"/>

      <!-- ears -->
      <path d="M -12 -113 L -23 -143 L -30 -109 Z" fill="url(#catBody)"/>
      <path d="M 12 -113 L 23 -143 L 30 -109 Z" fill="url(#catBody)"/>
      <path d="M -15 -115 L -21 -134 L -26 -112 Z" fill="#e6a4b4" opacity="0.85"/>
      <path d="M 15 -115 L 21 -134 L 26 -112 Z" fill="#e6a4b4" opacity="0.85"/>

      <!-- eyes — blink with realistic timing -->
      <ellipse cx="-13" cy="-95" rx="3.6" ry="5.4" fill="#ffe28a">
        <animate attributeName="ry" values="5.4;5.4;0.4;5.4;5.4" keyTimes="0;0.42;0.46;0.5;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="13" cy="-95" rx="3.6" ry="5.4" fill="#ffe28a">
        <animate attributeName="ry" values="5.4;5.4;0.4;5.4;5.4" keyTimes="0;0.42;0.46;0.5;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <!-- eye reflections -->
      <circle cx="-11.5" cy="-97" r="0.9" fill="#ffffff" opacity="0.9"/>
      <circle cx="14.5" cy="-97" r="0.9" fill="#ffffff" opacity="0.9"/>

      <!-- nose and whiskers -->
      <path d="M -4 -87 L 4 -87 L 0 -83 Z" fill="#e6a4b4"/>
      <g stroke="#6b6b73" stroke-width="1" opacity="0.7">
        <line x1="-16" y1="-84" x2="-38" y2="-89"/>
        <line x1="-16" y1="-81" x2="-38" y2="-81"/>
        <line x1="16" y1="-84" x2="38" y2="-89"/>
        <line x1="16" y1="-81" x2="38" y2="-81"/>
      </g>
    </g>
  </g>
</svg>
