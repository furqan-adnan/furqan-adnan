<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fffef2"/>
      <stop offset="100%" stop-color="#e6d9a8"/>
    </radialGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="900" height="220" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="900" height="220" fill="url(#sky)"/>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="55" cy="28" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="55" r="1.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="25" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="45" r="1.1"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="20" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="60" r="1.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="30" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="15" r="1.1"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="85" cy="110" r="1.1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.3s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="90" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="150" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="120" r="1.1"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.0s" begin="1.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- drifting clouds -->
    <g fill="#ffffff" opacity="0.055">
      <ellipse cx="0" cy="55" rx="90" ry="16"/>
      <ellipse cx="120" cy="55" rx="55" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="-150 0; 1050 0" dur="42s" repeatCount="indefinite"/>
    </g>
    <g fill="#ffffff" opacity="0.04">
      <ellipse cx="0" cy="145" rx="120" ry="20"/>
      <ellipse cx="150" cy="145" rx="70" ry="14"/>
      <animateTransform attributeName="transform" type="translate" values="1050 0; -220 0" dur="58s" repeatCount="indefinite"/>
    </g>

    <!-- moon -->
    <circle cx="760" cy="68" r="66" fill="url(#moonGlow)">
      <animate attributeName="r" values="62;72;62" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="68" r="42" fill="url(#moonBody)"/>
    <circle cx="748" cy="56" r="6" fill="#d8c98a" opacity="0.5"/>
    <circle cx="774" cy="80" r="4.5" fill="#d8c98a" opacity="0.4"/>
    <circle cx="766" cy="52" r="3" fill="#d8c98a" opacity="0.35"/>
    <circle cx="742" cy="78" r="2.5" fill="#d8c98a" opacity="0.3"/>

    <!-- cat, sitting, tail swaying, blinking -->
    <g transform="translate(165,206)">
      <!-- tail, anchored near the body and swaying -->
      <path d="M 50 -12 Q 95 -35 88 -85 Q 84 -108 62 -104" fill="none" stroke="#2b2b2f" stroke-width="13" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 50 -12; 12 50 -12; 0 50 -12; -8 50 -12; 0 50 -12" dur="4.5s" repeatCount="indefinite"/>
      </path>

      <!-- body -->
      <ellipse cx="0" cy="-33" rx="53" ry="37" fill="#2b2b2f"/>
      <!-- front paws -->
      <ellipse cx="-22" cy="-2" rx="10" ry="7" fill="#2b2b2f"/>
      <ellipse cx="14" cy="-2" rx="10" ry="7" fill="#2b2b2f"/>

      <!-- head -->
      <circle cx="-8" cy="-92" r="31" fill="#2b2b2f"/>
      <!-- ears -->
      <path d="M -33 -111 L -24 -136 L -12 -114 Z" fill="#2b2b2f"/>
      <path d="M 8 -114 L 16 -138 L 27 -113 Z" fill="#2b2b2f"/>
      <path d="M -27 -114 L -22 -128 L -15 -115 Z" fill="#41414a"/>
      <path d="M 12 -115 L 17 -129 L 23 -114 Z" fill="#41414a"/>

      <!-- eyes, closing briefly to blink -->
      <ellipse cx="-18" cy="-92" rx="3.6" ry="5.5" fill="#ffe28a">
        <animate attributeName="ry" values="5.5;5.5;0.4;5.5;5.5" keyTimes="0;0.42;0.46;0.5;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-1" cy="-92" rx="3.6" ry="5.5" fill="#ffe28a">
        <animate attributeName="ry" values="5.5;5.5;0.4;5.5;5.5" keyTimes="0;0.42;0.46;0.5;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>

      <!-- nose and whiskers -->
      <path d="M -11 -85 L -7 -82 L -13 -82 Z" fill="#e6a4b4"/>
      <g stroke="#55555c" stroke-width="1" opacity="0.7">
        <line x1="-14" y1="-83" x2="-34" y2="-87"/>
        <line x1="-14" y1="-80" x2="-34" y2="-80"/>
        <line x1="4" y1="-83" x2="24" y2="-87"/>
        <line x1="4" y1="-80" x2="24" y2="-80"/>
      </g>
    </g>
  </g>
</svg>
